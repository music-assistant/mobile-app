name: Check PR (iOS)

# Sanity-check that iOS builds and tests on PRs that could affect it. Pure
# Android-only PRs are skipped. This is NOT a release — it does no signing,
# no archive, no upload.

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'androidApp/**'
  pull_request:
    # ready_for_review is added so that flipping an auto-opened draft bump PR
    # to "Ready for review" triggers this check (default types don't include it).
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]
    paths-ignore:
      - 'androidApp/**'

permissions:
  contents: read

concurrency:
  group: ios-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: macos-26
    # A normal run takes 11-15 minutes. Without a limit, a hung test holds the
    # macOS runner for the 6-hour default.
    timeout-minutes: 45

    steps:
      - name: Skip for version bump PRs
        if: ${{ startsWith(github.head_ref, 'chore/bump-ios-build-') || startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: echo "Version bump PR — skipping compile"

      - name: Checkout code
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 21
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore simulator build caches
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        id: simulator-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-simulator-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-simulator-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}-
            ios-simulator-v1-${{ runner.os }}-${{ runner.arch }}-

      # WebRTC.xcframework is gitignored (~32 MB extracted, dSYMs shipped
      # separately). Cache keyed to the patched-binary release tag so
      # version/patch bumps trigger a redownload automatically. Keep in
      # sync with ios-release.yml and IOS-BUILD-INSTRUCTIONS.md.
      - name: Cache WebRTC.xcframework
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        id: cache-webrtc
        uses: actions/cache/restore@v6
        with:
          path: iosApp/Frameworks/WebRTC.xcframework
          key: webrtc-xcframework-m125-cow-bloat-fix.1

      - name: Download WebRTC.xcframework
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') && steps.cache-webrtc.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          curl -L --fail \
            "https://github.com/teancom/webrtc/releases/download/m125-cow-bloat-fix.1/WebRTC.xcframework.m125-cow-bloat-fix.1.zip" \
            -o /tmp/WebRTC.xcframework.zip
          mkdir -p iosApp/Frameworks
          unzip -q /tmp/WebRTC.xcframework.zip -d iosApp/Frameworks/
          rm /tmp/WebRTC.xcframework.zip
          test -d iosApp/Frameworks/WebRTC.xcframework/ios-arm64/WebRTC.framework

      - name: Grant execute permission for gradlew
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: chmod +x ./gradlew

      # Kotlin/Native tests cover shared Kotlin code, including artwork bridge behavior;
      # the separate XCTest step below covers the native Swift test target.
      - name: Run iOS Kotlin/Native tests
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./gradlew iosSimulatorArm64Test

      # The sendspin-kmp ABI dump comes from the iOS klibs, which need macOS.
      - name: Check the sendspin-kmp public API
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./gradlew :sendspin-kmp:checkKotlinAbi

      - name: Run native XCTest suite
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./scripts/test-ios.sh

      # Simulator destination + signing disabled gives us a compile-only pass:
      # Kotlin framework compilation runs via the Xcode build phase script, and
      # Swift compiles against the real iOS 26 SDK. No provisioning profile or
      # distribution cert required.
      - name: Build (no signing, simulator target)
        if: ${{ !startsWith(github.head_ref, 'chore/bump-ios-build-') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build

      - name: Save warmed simulator build caches
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ steps.simulator-cache.outputs.cache-primary-key }}

      - name: Save WebRTC framework cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache-webrtc.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: iosApp/Frameworks/WebRTC.xcframework
          key: webrtc-xcframework-m125-cow-bloat-fix.1
