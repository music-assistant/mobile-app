name: Android PlayStore Release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-22.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'android_playstore_release'))

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep 'versionName' androidApp/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode' androidApp/build.gradle.kts | sed 's/[^0-9]*//g')
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag=android-v${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Guard against duplicate tag
        id: guard
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists. Bump the version before releasing."
            exit 1
          fi
          # Previous Android tag, so neither notes source ever counts from an iOS tag
          echo "prev_tag=$(git tag -l 'android-v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/upload-keystore.jks
          cat > androidApp/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # Only the bundle: the GitHub APK is fetched from Play post-upload
      # (generatedapks API), so it carries the real Play app-signing key.
      - name: Build release AAB
        run: ./gradlew :androidApp:bundleRelease

      - name: Generate Play Store release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p distribution/whatsnew
          PREV_TAG='${{ steps.guard.outputs.prev_tag }}'
          if [ -n "$PREV_TAG" ]; then
            RAW=$(git log --first-parent --pretty=format:"- %s" "$PREV_TAG"..HEAD -- . ':!.github')
            # Drop entries whose PR carries the 'chore' label. Each first-parent
            # subject names its PR ("Merge pull request #N" / squash "title (#N)");
            # entries without a PR number (direct pushes) are kept.
            NOTES=""
            while IFS= read -r LINE; do
              [ -z "$LINE" ] && continue
              PR=$(printf '%s' "$LINE" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
              if [ -n "$PR" ]; then
                if gh pr view "$PR" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx 'chore'; then
                  echo "Skipping chore PR #$PR: $LINE"
                  continue
                fi
              fi
              NOTES="${NOTES}${LINE}"$'\n'
            done <<< "$RAW"
          else
            NOTES="Initial release"
          fi
          printf '%s' "${NOTES:0:500}" > distribution/whatsnew/whatsnew-en-US

      - name: Authenticate to Google Cloud
        id: gcloud-auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher

      - name: Upload to Google Play (open testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcloud-auth.outputs.credentials_file_path }}
          packageName: io.music_assistant.client
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          mappingFile: androidApp/build/outputs/mapping/release/mapping.txt
          track: beta
          status: completed
          whatsNewDirectory: distribution/whatsnew

      # Fetch the universal APK that Play generated from the uploaded bundle.
      # It is signed with the Play app-signing key (not forgeable), unlike the
      # old debug-key re-sign. Play needs a moment to process the bundle first.
      - name: Download Play-signed universal APK
        id: playapk
        run: |
          set -euo pipefail
          TOKEN='${{ steps.gcloud-auth.outputs.access_token }}'
          PKG='io.music_assistant.client'
          CODE='${{ steps.version.outputs.code }}'
          BASE="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PKG}/generatedApks/${CODE}"
          mkdir -p dist
          OUT="dist/music-assistant-${{ steps.version.outputs.name }}.apk"

          DL=""
          for i in $(seq 1 40); do   # ~20 min: 40 × 30s
            RESP=$(curl -sf -H "Authorization: Bearer $TOKEN" "$BASE") || RESP=""
            DL=$(echo "$RESP" | jq -r 'first(.generatedApks[]?.generatedUniversalApk.downloadId // empty)')
            if [ -n "$DL" ] && [ "$DL" != "null" ]; then break; fi
            echo "Play has not generated APKs yet (attempt $i); retrying in 30s…"
            sleep 30
          done

          if [ -z "$DL" ] || [ "$DL" = "null" ]; then
            echo "::warning::Play-generated universal APK not available after polling; releasing without an attached APK."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl -sfL -H "Authorization: Bearer $TOKEN" "${BASE}/downloads/${DL}:download?alt=media" -o "$OUT"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT"   # log the app-signing cert
          else
            echo "::notice::apksigner not found at $APKSIGNER; skipping cert log"
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Android v${{ steps.version.outputs.name }} (code ${{ steps.version.outputs.code }})"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG='${{ steps.guard.outputs.prev_tag }}'
          cat > /tmp/release-notes.md <<'EOF'
          ## Android Release ${{ steps.version.outputs.name }}

          - **Version code**: ${{ steps.version.outputs.code }}
          - **Track**: Open testing (Google Play)

          ### Direct download

          `music-assistant-${{ steps.version.outputs.name }}.apk` — universal build
          signed with the Google Play app key (installs alongside / updates Play installs).

          EOF
          # GitHub's generated notes (.github/release.yml filters), pinned to the
          # previous Android tag so an iOS tag never shortens the range
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            --jq .body >> /tmp/release-notes.md
          echo "file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Android ${{ steps.version.outputs.name }}"
          body_path: ${{ steps.notes.outputs.file }}
          files: |
            dist/music-assistant-*.apk
            androidApp/build/outputs/mapping/release/mapping.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A labeling failure must not stop the version bump below.
      - name: Label released issues
        continue-on-error: true
        run: .github/scripts/label-released-issues.sh '${{ steps.guard.outputs.prev_tag }}' '${{ steps.version.outputs.tag }}' 3DDC84
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Compute next version
        id: next
        run: |
          CURRENT="${{ steps.version.outputs.name }}"
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="${MAJOR}.${NEXT_MINOR}.0"
          NEXT_CODE=$(( ${{ steps.version.outputs.code }} + 1 ))
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "code=$NEXT_CODE" >> $GITHUB_OUTPUT
          echo "branch=chore/bump-android-v${NEXT_VERSION}" >> $GITHUB_OUTPUT

      - name: Push version bump branch
        run: |
          git fetch origin main
          git checkout -b "${{ steps.next.outputs.branch }}" origin/main

          sed -i "s/versionCode = ${{ steps.version.outputs.code }}/versionCode = ${{ steps.next.outputs.code }}/" androidApp/build.gradle.kts
          sed -i "s/versionName = \"${{ steps.version.outputs.name }}\"/versionName = \"${{ steps.next.outputs.version }}\"/" androidApp/build.gradle.kts

          git add androidApp/build.gradle.kts
          git commit -m "chore: bump Android version to ${{ steps.next.outputs.version }} (${{ steps.next.outputs.code }})"
          git push origin "${{ steps.next.outputs.branch }}"

      # Same mechanism as lokalise-pull.yml: actions/github-script + Octokit
      # (github.token), create-or-update, and issues.addLabels — which
      # auto-creates the label. Avoids the gh-CLI PR path that failed before.
      - name: Open bump PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const branch = '${{ steps.next.outputs.branch }}';
            const base = 'main';
            const { data: existing } = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base, per_page: 1,
            });
            let prNumber;
            if (existing.length > 0) {
              prNumber = existing[0].number;
              core.info(`PR #${prNumber} already open for ${branch}`);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner, repo, base, head: branch,
                title: 'chore: bump Android version to ${{ steps.next.outputs.version }} (${{ steps.next.outputs.code }})',
                body: 'Automated post-release version bump so `main` carries the next versionName/versionCode.',
                draft: true,
                maintainer_can_modify: true,
              });
              prNumber = pr.number;
              core.info(`Created PR #${prNumber}`);
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber, labels: ['automated', 'chore'],
            });
