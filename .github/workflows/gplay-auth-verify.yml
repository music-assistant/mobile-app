name: Verify Google Cloud Auth

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/androidpublisher'

      - name: Verify credentials
        run: |
          echo "✅ Authentication successful"
          echo "Project ID: ${{ steps.auth.outputs.project_id }}"
          echo "Credentials file exists: $(test -f '${{ steps.auth.outputs.credentials_file_path }}' && echo yes || echo no)"

      - name: Test Google Play api access
        run: |
          # Use the access_token output from the 'auth' step directly
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/io.music_assistant.client/reviews")
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Google Play API Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -eq "200" ]; then
            echo "✅ Success! The API can see your app."
          else
            echo "❌ Error $HTTP_STATUS: Access denied or app not found."
            echo "API Response: $BODY"
            exit 1
          fi

      - name: Test Google Play API access
        run: |
          ACCESS_TOKEN=${{ steps.auth.outputs.access_token }}
          # We check the 'internal' track specifically. This is a valid GET endpoint.
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/io.music_assistant.client/tracks/internal")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Google Play API access confirmed (HTTP $RESPONSE)"
          elif [ "$RESPONSE" = "404" ]; then
            echo "❌ HTTP 404: The App ID is wrong OR the Service Account wasn't invited to this specific app."
            exit 1
          else
            echo "❌ Google Play API returned HTTP $RESPONSE"
            exit 1
          fi
