name: Check PR (Android)

on:
  pull_request:
    # ready_for_review is added so that flipping an auto-opened draft bump PR
    # to "Ready for review" triggers this check (default types don't include it).
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main ]
    # Skip Android PR checks when a PR only touches iOS-exclusive files.
    # Shared code (composeApp, gradle, etc.) still triggers a build.
    paths-ignore:
      - 'iosApp/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Skip for version bump PRs
        if: ${{ startsWith(github.head_ref, 'chore/bump-android-v') || startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: echo "Version bump PR — skipping build"

      - name: Checkout code
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./gradlew :androidApp:assembleDebug

      - name: Run tests
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./gradlew :androidApp:testDebug testAndroidHostTest

      # The sendspin-kmp README quick start against the local publication, on the consumer
      # Kotlin floor. The release job runs the same check; here a break shows up in the PR.
      # The Android consumer needs no iOS publication, so a Linux host is enough.
      - name: Check sendspin-kmp as a consumer
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: |
          VERSION=$(grep -E '^sendspinVersion=' gradle.properties | cut -d= -f2)
          ./gradlew :sendspin-kmp:publishToMavenLocal
          ./gradlew -p sendspin-kmp/consumer-check \
            :app:compileDebugKotlin :app:minifyReleaseWithR8 :app:checkReleasePermissions \
            -PsendspinVersion="$VERSION"

      - name: Run lint
        if: ${{ !startsWith(github.head_ref, 'chore/bump-android-v') && !startsWith(github.head_ref, 'chore/bump-sendspin-v') }}
        run: ./gradlew :androidApp:lintDebug
